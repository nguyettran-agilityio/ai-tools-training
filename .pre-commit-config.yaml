# Lives at the git root (pre-commit only reads config from there), but every
# hook is scoped to fastapi-practice/. ruff picks up fastapi-practice/pyproject.toml
# on its own because it resolves config from the nearest pyproject.toml per file.
files: ^fastapi-practice/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        name: ruff check (fastapi-practice)
        args: [--fix]
      - id: ruff-format
        name: ruff format (fastapi-practice)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
