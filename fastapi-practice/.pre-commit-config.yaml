repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        name: ruff check (fastapi/practice)
        files: ^fastapi/practice/
        args: [--fix]
      - id: ruff-format
        name: ruff format (fastapi/practice)
        files: ^fastapi/practice/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^fastapi/practice/
      - id: end-of-file-fixer
        files: ^fastapi/practice/
      - id: check-yaml
        files: ^fastapi/practice/
      - id: check-merge-conflict
      - id: debug-statements
        files: ^fastapi/practice/
      - id: check-added-large-files
        files: ^fastapi/practice/
