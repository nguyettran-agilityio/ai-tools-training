[project]
name = "library-management-practice"
version = "0.1.0"
description = "Library Management System — FastAPI practice project (layered / clean architecture with repository pattern)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "httpx2>=2.9.1",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` (and friends) in argument defaults is the
# idiomatic, documented dependency-injection pattern — not the mutable-default
# footgun B008 is meant to catch. See https://fastapi.tiangolo.com/tutorial/dependencies/
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# Scoped to `app/` on purpose: this is about protecting the repository-pattern
# contract (services/routers depend on Interface, not a concrete ORM class),
# not full strict typing everywhere — `tests/` has its own dynamic patterns
# (fixtures, `create_autospec`) that aren't worth fighting the checker over.
# The one exception is `tests/fakes.py`: the fakes implement the same
# repository interfaces, so checking them keeps their signatures (e.g. the
# per-module `UpdateFields` TypedDict on `update()`) in sync with `app/`.
files = ["app", "tests/fakes.py"]
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# SQLModel types a class-level field as its plain Python type (`str`,
# `datetime`, an enum...) rather than a SQLAlchemy `InstrumentedAttribute`,
# so every query expression built at class level (`Model.field.ilike(...)`,
# `Model.field == x`, `.in_()`, `.is_()`, `.asc()`, `.desc()`) is a false
# positive — a known, permanent SQLModel/mypy gap (SQLModel trades
# query-expression typing for Pydantic-model ergonomics), not a real bug.
# Scoped to exactly the files that legitimately build these expressions —
# the ORM-specific `repositories_sqlmodel.py` per module, plus the one CLI
# script that queries directly for bulk demo-data cleanup.
module = ["app.modules.*.repositories_sqlmodel", "app.cli.seed_demo"]
disable_error_code = ["attr-defined", "arg-type", "union-attr"]
